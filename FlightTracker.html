<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#002147">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flight Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --longwood-dark-green: #004c46;
    --longwood-navy: #002147;
    --longwood-mint: #ceebee;
    --longwood-gray: #a2a4a3;
    --brock-gold: #dfc25b;
    --brock-stone: #baab93;
    --white: #ffffff;
    --off-white: #f7f5f1;

    /* Status colors — kept functional but warmed to palette */
    --status-green: #2d7a4f;
    --status-yellow: #b8860b;
    --status-red: #8b2a2a;
    --status-blue: #004c46;
    --status-muted: #a2a4a3;
  }

  html, body {
    min-height: 100vh;
    background: var(--off-white);
    font-family: 'Source Sans 3', sans-serif;
    color: var(--longwood-navy);
  }

  /* Gold sidebar strip — brand signature */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 5px;
    height: 100%;
    background: var(--brock-gold);
    z-index: 100;
  }

  /* ── Header ── */
  header {
    background: var(--longwood-navy);
    padding: 1.75rem 2rem 1.5rem 2rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  .header-left { display: flex; flex-direction: column; gap: 0.3rem; }

  .header-eyebrow {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brock-gold);
  }

  .header-title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.85rem;
    line-height: 1.05;
    color: var(--white);
    letter-spacing: -0.01em;
  }

  .header-title em {
    font-style: italic;
    color: var(--longwood-mint);
  }

  .heading-rule {
    width: 40px;
    height: 2px;
    background: var(--brock-gold);
    margin-top: 0.6rem;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--longwood-gray);
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--status-green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  #clock {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--brock-gold);
    letter-spacing: 0.08em;
  }

  .btn-add {
    background: var(--brock-gold);
    color: var(--longwood-navy);
    border: none;
    padding: 0.5rem 1.1rem;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-add:hover { background: #e8ce72; }

  .btn-refresh {
    background: none;
    border: 1px solid rgba(223,194,91,0.35);
    color: var(--brock-gold);
    padding: 0.5rem 1rem;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-refresh:hover { border-color: var(--brock-gold); background: rgba(223,194,91,0.08); }
  .btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-refresh .spin { display: inline-block; }
  .btn-refresh.loading .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.75rem 1.75rem 3rem 2rem;
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(162,164,163,0.25);
  }

  .toolbar-left {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--longwood-gray);
  }

  .call-count {
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--longwood-gray);
  }

  /* ── Board header ── */
  .board-header {
    display: grid;
    grid-template-columns: 1fr 130px 110px 140px 150px 48px;
    gap: 0;
    padding: 0.5rem 1rem;
    border-bottom: 2px solid var(--brock-gold);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--longwood-gray);
    margin-bottom: 4px;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--longwood-gray);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px dashed rgba(162,164,163,0.35);
    background: var(--white);
  }

  .empty-state .big {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 900;
    color: var(--longwood-mint);
    display: block;
    margin-bottom: 0.75rem;
  }

  /* ── Flight row ── */
  .flight-row {
    display: grid;
    grid-template-columns: 1fr 130px 110px 140px 150px 48px;
    gap: 0;
    align-items: center;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid rgba(162,164,163,0.2);
    background: var(--white);
    border-left: 3px solid var(--brock-gold);
    margin-bottom: 3px;
    transition: background 0.18s;
    animation: rowIn 0.25s ease;
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .flight-row:hover { background: var(--longwood-mint); }

  .flight-row.updating .flight-status {
    animation: flip 0.4s ease;
  }

  @keyframes flip {
    0%   { transform: rotateX(0deg);  opacity: 1; }
    50%  { transform: rotateX(90deg); opacity: 0; }
    100% { transform: rotateX(0deg);  opacity: 1; }
  }

  .cell-label {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--longwood-navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-flight {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--longwood-dark-green);
    letter-spacing: 0.08em;
  }

  .cell-gate {
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--longwood-gray);
    letter-spacing: 0.08em;
  }

  .cell-departs {
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--longwood-navy);
  }

  /* Status badge */
  .flight-status {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid currentColor;
    display: inline-block;
  }

  .status-on-time   { color: var(--status-green); }
  .status-delayed   { color: var(--status-yellow); }
  .status-cancelled { color: var(--status-red); }
  .status-boarding  { color: var(--brock-gold); animation: boardingPulse 1.5s infinite; }
  .status-departed  { color: var(--longwood-dark-green); }
  .status-landed    { color: var(--status-muted); }
  .status-scheduled { color: var(--status-muted); }

  @keyframes boardingPulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }

  /* Actions */
  .cell-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .btn-icon {
    background: none;
    border: 1px solid rgba(162,164,163,0.35);
    color: var(--longwood-gray);
    width: 26px;
    height: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.15s;
  }
  .btn-icon:hover { border-color: var(--status-red); color: var(--status-red); }

  /* Last updated */
  .last-updated {
    font-size: 0.6rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--longwood-gray);
    text-align: right;
    margin-top: 1rem;
  }

  /* ── Modal ── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,33,71,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--white);
    border-top: 4px solid var(--brock-gold);
    border: 1px solid rgba(162,164,163,0.35);
    border-top: 4px solid var(--brock-gold);
    padding: 2.25rem;
    width: 480px;
    max-width: 95vw;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal-eyebrow {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brock-gold);
    margin-bottom: 0.35rem;
  }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.5rem;
    color: var(--longwood-navy);
    margin-bottom: 0.6rem;
  }

  .modal-rule {
    width: 36px;
    height: 2px;
    background: var(--brock-gold);
    margin-bottom: 1.5rem;
  }

  .form-group { margin-bottom: 1.1rem; }

  .form-group label {
    display: block;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--longwood-gray);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    background: var(--off-white);
    border: 1px solid rgba(162,164,163,0.5);
    color: var(--longwood-navy);
    padding: 0.55rem 0.75rem;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .form-group input:focus,
  .form-group select:focus { border-color: var(--brock-gold); }
  .form-group select option { background: var(--white); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Airline preview pill */
  .airline-preview-pill {
    background: var(--off-white);
    border: 1px solid rgba(162,164,163,0.5);
    border-right: none;
    padding: 0.55rem 0.75rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--longwood-dark-green);
    min-width: 44px;
    text-align: center;
    letter-spacing: 0.08em;
  }

  .flight-preview-line {
    margin-top: 5px;
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--longwood-gray);
    letter-spacing: 0.12em;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: none;
    border: 1px solid rgba(162,164,163,0.5);
    color: var(--longwood-gray);
    padding: 0.5rem 1.25rem;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: var(--longwood-navy); color: var(--longwood-navy); }

  .btn-save {
    background: var(--longwood-navy);
    border: none;
    color: var(--white);
    padding: 0.5rem 1.25rem;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-save:hover { background: var(--longwood-dark-green); }

  /* ── Footer ── */
  .page-footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.75rem 2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .footer-rule {
    width: 100%;
    height: 1px;
    background: var(--longwood-gray);
    opacity: 0.2;
  }

  .footer-text {
    font-size: 0.6rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--longwood-gray);
  }

  .footer-text strong {
    color: var(--longwood-dark-green);
    font-weight: 600;
  }

  /* ── Mobile ── */
  @media (max-width: 700px) {
    .board-header { display: none; }

    .flight-row {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 6px;
    }

    header {
      padding: 1.25rem 1rem 1.1rem 1.25rem;
      gap: 0.75rem;
    }

    .header-title { font-size: 1.4rem; }

    .header-right {
      width: 100%;
      justify-content: space-between;
    }

    .live-indicator { display: none; }

    .btn-refresh,
    .btn-add { padding: 0.4rem 0.75rem; font-size: 0.65rem; }

    main { padding: 1.25rem 1rem 2rem 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-eyebrow">Longwood University · Brock Experiences</div>
    <h1 class="header-title">Flight <em>Tracker</em></h1>
    <div class="heading-rule"></div>
  </div>
  <div class="header-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span>Live</span>
    </div>
    <div id="clock">--:--:--</div>
    <button class="btn-refresh" id="btn-refresh" onclick="manualRefresh()">
      <span class="spin">⟳</span> Refresh
    </button>
    <button class="btn-add" onclick="openModal()">+ Add Flight</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="toolbar-left" id="flight-count">0 flights tracked</div>
    <div class="call-count" id="call-count">API calls this month: 0 / 100</div>
  </div>

  <div class="board-header">
    <div>Label</div>
    <div>Flight</div>
    <div>Gate</div>
    <div>Arrives</div>
    <div>Status</div>
    <div></div>
  </div>

  <div id="flight-list"></div>

  <div class="last-updated" id="last-updated"></div>
</main>

<div class="page-footer">
  <div class="footer-rule"></div>
  <div class="footer-text"><strong>Brock Experiences</strong> · Longwood University</div>
</div>

<!-- Add Flight Modal -->
<div class="modal-backdrop" id="modal" onclick="closeModalIfBackdrop(event)">
  <div class="modal">
    <div class="modal-eyebrow">Brock Experiences</div>
    <h2>Add Flight</h2>
    <div class="modal-rule"></div>

    <div class="form-group">
      <label>Custom Label</label>
      <input type="text" id="f-label" placeholder="e.g. Dad's Flight, Team Arrival" maxlength="30">
    </div>
    <div class="form-group">
      <label>Airline</label>
      <select id="f-airline">
        <option value="">— Select Airline —</option>
        <optgroup label="Major US">
          <option value="AA">AA — American Airlines</option>
          <option value="DL">DL — Delta Air Lines</option>
          <option value="UA">UA — United Airlines</option>
          <option value="WN">WN — Southwest Airlines</option>
          <option value="B6">B6 — JetBlue Airways</option>
          <option value="AS">AS — Alaska Airlines</option>
          <option value="MX">MX — Breeze Airways</option>
          <option value="F9">F9 — Frontier Airlines</option>
          <option value="NK">NK — Spirit Airlines</option>
          <option value="G4">G4 — Allegiant Air</option>
          <option value="SY">SY — Sun Country Airlines</option>
        </optgroup>
        <optgroup label="International">
          <option value="AC">AC — Air Canada</option>
          <option value="AF">AF — Air France</option>
          <option value="BA">BA — British Airways</option>
          <option value="EK">EK — Emirates</option>
          <option value="LH">LH — Lufthansa</option>
          <option value="QR">QR — Qatar Airways</option>
          <option value="SQ">SQ — Singapore Airlines</option>
          <option value="CX">CX — Cathay Pacific</option>
          <option value="JL">JL — Japan Airlines</option>
          <option value="NH">NH — ANA</option>
          <option value="KL">KL — KLM</option>
          <option value="IB">IB — Iberia</option>
          <option value="TK">TK — Turkish Airlines</option>
          <option value="VS">VS — Virgin Atlantic</option>
        </optgroup>
        <optgroup label="Regional / Other">
          <option value="9X">9X — Southern Airways Express</option>
          <option value="MQ">MQ — Envoy Air (AA regional)</option>
          <option value="OO">OO — SkyWest Airlines</option>
          <option value="YX">YX — Republic Airways</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group">
      <label>Flight Number</label>
      <div style="display:flex;gap:0;align-items:center;">
        <div id="airline-preview" class="airline-preview-pill">—</div>
        <input type="number" id="f-number" placeholder="e.g. 1234" min="1" max="9999"
          style="flex:1;border-left:none;" oninput="updatePreview()">
      </div>
      <div id="flight-preview-line" class="flight-preview-line"></div>
    </div>
    <div class="form-group">
      <label>Scheduled Departure</label>
      <input type="time" id="f-departs">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="addFlight()">Save Flight</button>
    </div>
  </div>
</div>

<script>
// ─── Storage ───────────────────────────────────────────────────────────────
const STORAGE_KEY    = 'flightwatch_flights';
const LANDED_KEY     = 'flightwatch_landed';
const CALL_COUNT_KEY = 'flightwatch_calls';

function loadFlights() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveFlights(f) { localStorage.setItem(STORAGE_KEY, JSON.stringify(f)); }
function loadLanded() {
  try { return new Set(JSON.parse(localStorage.getItem(LANDED_KEY)) || []); }
  catch { return new Set(); }
}
function saveLanded(s) { localStorage.setItem(LANDED_KEY, JSON.stringify([...s])); }

// ─── Call counter ─────────────────────────────────────────────────────────
function getCallCount() {
  try {
    const stored = JSON.parse(localStorage.getItem(CALL_COUNT_KEY));
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${now.getMonth()}`;
    if (stored && stored.month === monthKey) return stored.count;
    return 0;
  } catch { return 0; }
}
function incrementCallCount() {
  const now = new Date();
  const monthKey = `${now.getFullYear()}-${now.getMonth()}`;
  const count = getCallCount() + 1;
  localStorage.setItem(CALL_COUNT_KEY, JSON.stringify({ month: monthKey, count }));
  renderCallCount();
}
function renderCallCount() {
  const el = document.getElementById('call-count');
  if (el) el.textContent = `API calls this month: ${getCallCount()} / 100`;
}

// ─── AviationStack API ─────────────────────────────────────────────────────
function normalizeStatus(raw) {
  if (!raw) return 'scheduled';
  const s = raw.toLowerCase();
  if (s === 'landed')    return 'landed';
  if (s === 'active')    return 'in-air';
  if (s === 'scheduled') return 'scheduled';
  if (s === 'cancelled') return 'cancelled';
  if (s === 'incident')  return 'cancelled';
  if (s === 'diverted')  return 'delayed';
  return 'scheduled';
}

async function fetchFlightStatus(flight) {
  const url = `https://flightwatch-proxy.josh-blakely.workers.dev?flight_iata=${flight.number}`;
  const res  = await fetch(url);
  const data = await res.json();
  incrementCallCount();

  const f = data?.data?.[0];
  if (!f) return { status: 'scheduled', gate: '—', delay: 0 };
  const status    = normalizeStatus(f.flight_status);
  const gate      = f.departure?.gate || '—';
  const delay     = f.departure?.delay || 0;
  const scheduled = f.arrival?.scheduled || null;
  const estimated = f.arrival?.estimated || null;
  const useEstimated = ['active', 'landed'].includes(f.flight_status?.toLowerCase());
  const arrivalRaw = (useEstimated && estimated) ? estimated : scheduled;
  const arrival = arrivalRaw
    ? new Date(arrivalRaw).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' })
    : '—';
  return { status, gate, delay, arrival };
}

// ─── State ─────────────────────────────────────────────────────────────────
let flights   = loadFlights();
let landedIds = loadLanded();
let liveData  = {};

landedIds.forEach(id => {
  liveData[id] = { status: 'landed', gate: '—', delay: 0 };
});

// ─── Render ────────────────────────────────────────────────────────────────
function statusClass(status) {
  const map = {
    'scheduled': 'status-scheduled',
    'on-time':   'status-on-time',
    'in-air':    'status-departed',
    'boarding':  'status-boarding',
    'delayed':   'status-delayed',
    'cancelled': 'status-cancelled',
    'landed':    'status-landed',
    'waiting':   'status-scheduled',
  };
  return map[status] || 'status-scheduled';
}

function statusLabel(status, delay) {
  if (status === 'delayed' && delay) return `DELAYED +${delay}m`;
  const labels = {
    'scheduled': 'SCHEDULED',
    'on-time':   'ON TIME',
    'in-air':    'IN AIR',
    'boarding':  'BOARDING',
    'delayed':   'DELAYED',
    'cancelled': 'CANCELLED',
    'landed':    'LANDED',
    'waiting':   'WAITING',
  };
  return labels[status] || status.toUpperCase();
}

function renderFlights() {
  const list  = document.getElementById('flight-list');
  const count = document.getElementById('flight-count');
  count.textContent = `${flights.length} flight${flights.length !== 1 ? 's' : ''} tracked`;

  if (flights.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <span class="big">✈</span>
      No flights tracked yet<br>
      <small style="font-size:0.65rem;margin-top:6px;display:block;letter-spacing:0.1em;">Click + Add Flight to get started</small>
    </div>`;
    return;
  }

  list.innerHTML = flights.map(f => {
    const now = new Date();
    const withinWindow = !f.departs || (() => {
      const [hh, mm] = f.departs.split(':').map(Number);
      const dep = new Date(); dep.setHours(hh, mm, 0, 0);
      return (dep - now) / 60000 <= 120;
    })();
    const live = withinWindow
      ? (liveData[f.id] || { status: 'scheduled', gate: '—', delay: 0 })
      : { status: 'waiting', gate: '—', delay: 0 };
    const sc      = statusClass(live.status);
    const sl      = statusLabel(live.status, live.delay);
    const gate    = live.gate || '—';
    const arrival = live.arrival || '—';
    const isLanded = landedIds.has(f.id);
    const rowStyle = isLanded ? 'opacity:0.4;' : '';

    return `<div class="flight-row" id="row-${f.id}" style="${rowStyle}">
      <div class="cell-label" title="${f.label}">${f.label}</div>
      <div class="cell-flight">${f.number.toUpperCase()}</div>
      <div class="cell-gate">${gate}</div>
      <div class="cell-departs">${arrival}</div>
      <div class="flight-status ${sc}">${sl}</div>
      <div class="cell-actions">
        <button class="btn-icon" title="Remove" onclick="removeFlight('${f.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ─── Refresh ───────────────────────────────────────────────────────────────
let isRefreshing = false;

async function refreshAll() {
  if (isRefreshing) return;

  const now = new Date();
  const toFetch = flights.filter(f => {
    if (landedIds.has(f.id)) return false;
    if (!f.departs) return true;
    const [hh, mm] = f.departs.split(':').map(Number);
    const dep = new Date(); dep.setHours(hh, mm, 0, 0);
    return (dep - now) / 60000 <= 120;
  });

  if (toFetch.length === 0) { renderFlights(); return; }

  isRefreshing = true;
  const btn = document.getElementById('btn-refresh');
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }

  const updates = await Promise.all(
    toFetch.map(async f => {
      try {
        const data = await fetchFlightStatus(f);
        return { id: f.id, data, ok: true };
      } catch (e) {
        console.error(`Failed to fetch ${f.number}:`, e);
        return { id: f.id, data: liveData[f.id] || { status: 'scheduled', gate: '—', delay: 0 }, ok: false };
      }
    })
  );

  updates.forEach(({ id, data }) => {
    const prev = liveData[id];
    liveData[id] = data;

    if (data.status === 'landed' && !landedIds.has(id)) {
      landedIds.add(id);
      saveLanded(landedIds);
    }

    if (prev && prev.status !== data.status) {
      const row = document.getElementById(`row-${id}`);
      if (row) {
        row.classList.add('updating');
        setTimeout(() => row.classList.remove('updating'), 500);
      }
    }
  });

  renderFlights();
  renderCallCount();
  document.getElementById('last-updated').textContent =
    `Last updated: ${now.toLocaleTimeString()}`;

  isRefreshing = false;
  if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
}

function manualRefresh() { refreshAll(); }

// ─── Clock ─────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {
    hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}
setInterval(updateClock, 1000);

// ─── Airline preview ───────────────────────────────────────────────────────
function updatePreview() {
  const airline = document.getElementById('f-airline').value;
  const num     = document.getElementById('f-number').value;
  document.getElementById('airline-preview').textContent = airline || '—';
  document.getElementById('flight-preview-line').textContent =
    airline && num ? `Flight: ${airline}${num}` : '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-airline').addEventListener('change', updatePreview);
});

// ─── Add / Remove ──────────────────────────────────────────────────────────
function addFlight() {
  const label   = document.getElementById('f-label').value.trim();
  const airline = document.getElementById('f-airline').value;
  const num     = document.getElementById('f-number').value.trim();

  const labelEl   = document.getElementById('f-label');
  const airlineEl = document.getElementById('f-airline');
  const numEl     = document.getElementById('f-number');

  labelEl.style.borderColor = airlineEl.style.borderColor = numEl.style.borderColor = '';

  let valid = true;
  if (!label)   { labelEl.style.borderColor   = '#8b2a2a'; valid = false; }
  if (!airline) { airlineEl.style.borderColor = '#8b2a2a'; valid = false; }
  if (!num)     { numEl.style.borderColor     = '#8b2a2a'; valid = false; }
  if (!valid) return;

  const departs = document.getElementById('f-departs').value;
  const flight = { id: Date.now().toString(), label, number: `${airline}${num}`, departs };
  flights.push(flight);
  saveFlights(flights);
  closeModal();
  renderFlights();
  refreshAll();
}

function removeFlight(id) {
  flights = flights.filter(f => f.id !== id);
  landedIds.delete(id);
  delete liveData[id];
  saveFlights(flights);
  saveLanded(landedIds);
  renderFlights();
  renderCallCount();
}

// ─── Modal ─────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('f-label').value   = '';
  document.getElementById('f-airline').value = '';
  document.getElementById('f-number').value  = '';
  document.getElementById('f-departs').value = '';
  document.getElementById('airline-preview').textContent     = '—';
  document.getElementById('flight-preview-line').textContent = '';
  ['f-label','f-airline','f-number'].forEach(id =>
    document.getElementById(id).style.borderColor = ''
  );
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-label').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function closeModalIfBackdrop(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) addFlight();
});

// ─── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderFlights();
  renderCallCount();
  refreshAll();
  updateClock();
});
</script>
</body>
</html>
